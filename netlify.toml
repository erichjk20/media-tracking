[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/api/aladin/books"
  to = "/.netlify/functions/aladin-books"
  status = 200

[[redirects]]
  from = "/api/mangadex/manga"
  to = "/.netlify/functions/mangadex-manga"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
